name: Release iOS IPA

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Sadece iOS Hedefini Derle
      - name: Build iOS Target
        run: |
          cd app
          xcodebuild -project StremioX.xcodeproj \
            -scheme StremioXiOSNative \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ci-ios \
            CODE_SIGNING_ALLOWED=NO build

      # 2. IPA Paketleme (Payload Hatasını Çözen Kısım)
      - name: Create Unsigned IPA
        run: |
          cd app
          # Payload klasörünü oluştur ve .app dosyasını içine kopyala
          mkdir -p Payload
          cp -r build/ci-ios/Build/Products/Release-iphoneos/StremioXiOSNative.app Payload/
          
          # Payload klasörünü IPA olarak zip'le
          zip -qr StremioXiOSNative.ipa Payload
          
          # Temizlik
          rm -rf Payload

      # 3. IPA'yı İş Akışına Artifact Olarak Yükle
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StremioXiOSNative-IPA
          path: app/StremioXiOSNative.ipa

      # 4. (Opsiyonel) Tag atıldığında GitHub Release Sayfasına Ekle
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/StremioXiOSNative.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
